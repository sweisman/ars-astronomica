theme: jekyll-theme-primer
lang: en
title: Ars Astronomica
description: First English translations of historical Hebrew and Latin works in astronomy, cosmology, and natural philosophy.
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

# Paste the token from Search Console / Bing Webmaster Tools ("HTML tag" method)
# to have jekyll-seo-tag emit the verification <meta> tags, then submit sitemap.xml.
# webmaster_verifications:
#   google: YOUR_GOOGLE_TOKEN
#   bing: YOUR_BING_TOKEN
twitter:
  username: ArsAstronomica
  card: summary_large_image
# One page per work, so each book has its own indexable URL. Pages are
# generated from the private repo by publish.py; do not edit _works/ by hand.
collections:
  works:
    output: true
defaults:
  - scope:
      path: ""
    values:
      image:
        path: /logo-with-name.png
        width: 1200
        height: 630
  # The Search Console verification file is not a page; keep it out of the
  # sitemap. It has to be served byte-for-byte, so it cannot carry front matter
  # and has to be excluded from here instead.
  - scope:
      path: google30e8504600ff322d.html
    values:
      sitemap: false
