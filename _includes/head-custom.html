<style>
  /* The theme caps the page at ~1010px, which clips the six-column corpus
     table. Give the content more room and trim the side padding. */
  .container-lg {
    max-width: 1400px;
  }

  @media (max-width: 767px) {
    .container-lg.px-3 {
      padding-left: 12px !important;
      padding-right: 12px !important;
    }
  }

  /* Even at 1400px the table can outrun a narrow window. Scroll the table
     itself rather than letting it clip or push the whole page sideways. */
  .markdown-body table {
    display: block;
    width: max-content;
    max-width: 100%;
    overflow-x: auto;
  }

  /* The Description column carries most of the width; keep it readable
     rather than letting one long cell stretch the whole row. */
  .markdown-body table td:nth-child(5) {
    min-width: 22rem;
  }
</style>
